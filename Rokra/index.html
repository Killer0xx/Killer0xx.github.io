<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rokra</title>
<meta name="description" content="Rokra (روکڑا): ATMs near you in Pakistan, and whether they have cash.">
<style>
:root{--bg:#fff;--ink:#111;--sub:#555;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--ink:#f2f2f2;--sub:#a8a8a8;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:8px}
.mark{width:44px;height:44px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
 display:grid;place-items:center;font-weight:900;font-size:20px}
.brand{font-weight:900;font-size:22px;letter-spacing:.2px}
.brand small{display:block;font-weight:600;font-size:13px;color:var(--sub)}
h1{font-size:28px;line-height:1.2;margin:24px 0 4px;text-wrap:balance}
h2{font-size:19px;margin:30px 0 8px;padding-top:14px;border-top:2px solid var(--ink)}
a{color:var(--ink);text-underline-offset:3px}
code{font:14px ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--sub);padding:0 4px}
li{margin:4px 0}
em{color:var(--sub)}
.key{display:inline-block;margin-top:18px;padding:12px 22px;border:2px solid var(--ink);
 border-radius:999px;box-shadow:3px 3px 0 var(--ink);font-weight:800;text-decoration:none}
footer{margin-top:40px;padding-top:12px;border-top:2px solid var(--ink);color:var(--sub);font-size:13px}
</style>
</head>
<body><main>
<header><div class="mark">R</div>
<div class="brand">Rokra <span lang="ur">روکڑا</span><small>ATMs near you, and whether they have cash</small></div></header>
<h1>Rokra</h1>
<p>Rokra shows the ATMs near you in Pakistan and whether they have cash right now,
as reported by people standing at them. Free, no login.</p>
<a class="key" href="privacy-policy.html">Privacy policy</a>
<footer>Rokra · Pakistan · Map data © OpenStreetMap contributors</footer>
</main></body></html>
